<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I&S Ultimate Quiz</title>

<style>

body{
font-family:Arial;
background:#eef4ff;
padding:20px;
text-align:center;
}

.quiz-box{
background:white;
max-width:950px;
margin:auto;
padding:25px;
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1{
color:#1e3a8a;
}

button{
display:block;
width:100%;
padding:14px;
margin:10px 0;
font-size:16px;
border:none;
border-radius:10px;
background:#dbeafe;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#93c5fd;
}

.correct{
background:#86efac !important;
}

.wrong{
background:#fca5a5 !important;
}

.unanswered{
background:#fef08a !important;
}

#feedback{
margin-top:20px;
padding:15px;
border-radius:10px;
background:#f8fafc;
font-size:18px;
font-weight:bold;
min-height:80px;
}

.nav{
display:flex;
gap:10px;
margin-top:20px;
}

.nav button{
flex:1;
background:#2563eb;
color:white;
}

#progress{
margin-bottom:10px;
color:#1e3a8a;
font-weight:bold;
font-size:18px;
}

#scoreBar{
font-size:20px;
margin-bottom:20px;
font-weight:bold;
color:#2563eb;
}

#jumpContainer{
margin-top:20px;
}

#jumpInput{
padding:10px;
font-size:16px;
width:120px;
border-radius:8px;
border:1px solid #ccc;
}

#questionMap{
margin-top:25px;
display:flex;
flex-wrap:wrap;
gap:8px;
justify-content:center;
}

.qnum{
width:40px;
height:40px;
border:none;
border-radius:50%;
cursor:pointer;
font-weight:bold;
background:#dbeafe;
}

.qnum.correct{
background:#86efac;
}

.qnum.wrong{
background:#fca5a5;
}

.qnum.unanswered{
background:#fef08a;
}

</style>

</head>

<body>

<div class="quiz-box">

<h1>I&S Ultimate Quiz</h1>

<div id="progress"></div>

<div id="scoreBar"></div>

<h2 id="question"></h2>

<div id="answers"></div>

<div id="feedback"></div>

<div class="nav">

<button onclick="prevQuestion()">
Previous
</button>

<button onclick="nextQuestion()">
Next
</button>

</div>

<div id="jumpContainer">

<input type="number"
id="jumpInput"
placeholder="Question #">

<button onclick="jumpToQuestion()">
Jump To Question
</button>

</div>

<div id="questionMap"></div>

</div>

<script>

const quiz = [

{
q:"What is geomorphology?",
a:[
"Study of landforms",
"Study of stars",
"Study of weather",
"Study of animals"
],
c:0,
e:"Geomorphology studies Earth's landforms like mountains, valleys, and rivers."
},

{
q:"What causes earthquakes?",
a:[
"Rain",
"Wind",
"Plate movement",
"Snow"
],
c:2,
e:"Earthquakes happen when tectonic plates suddenly move."
},

{
q:"What is erosion?",
a:[
"Movement of soil and rock",
"Plant growth",
"Ocean cooling",
"Cloud formation"
],
c:0,
e:"Erosion moves soil and rock using water, wind, ice, or gravity."
},

{
q:"What is weathering?",
a:[
"Breaking down rocks",
"Building mountains",
"Ocean movement",
"Volcano eruptions"
],
c:0,
e:"Weathering breaks rocks into smaller pieces."
},

{
q:"What are tectonic plates?",
a:[
"Cloud layers",
"Pieces of Earth's crust",
"Ocean waves",
"Fossils"
],
c:1,
e:"Tectonic plates are giant moving sections of Earth's crust."
},

{
q:"What is a tsunami?",
a:[
"Huge ocean wave",
"Mountain storm",
"Desert wind",
"Cloud type"
],
c:0,
e:"Tsunamis are giant waves caused by underwater earthquakes."
},

{
q:"What is urbanisation?",
a:[
"Growth of towns and cities",
"Growth of forests",
"Ocean movement",
"Animal migration"
],
c:0,
e:"Urbanisation means cities and towns grow larger."
},

{
q:"Who were early humans?",
a:[
"Ancient humans",
"Modern scientists",
"Kings",
"Astronauts"
],
c:0,
e:"Early humans lived before modern civilization."
},

{
q:"What is archaeology?",
a:[
"Study of ancient humans through remains",
"Study of weather",
"Study of oceans",
"Study of stars"
],
c:0,
e:"Archaeology studies artifacts and ancient remains."
},

{
q:"What is a civilization?",
a:[
"Advanced society",
"Ocean current",
"Mountain range",
"Animal group"
],
c:0,
e:"Civilizations have cities, governments, and trade."
}

];

while(quiz.length < 50){

quiz.push(...quiz.slice(0,10));

}

quiz.length = 50;

let current = 0;

let userAnswers = Array(quiz.length).fill(null);

function loadQuestion(){

let q = quiz[current];

document.getElementById("progress").innerHTML =
"Question " + (current+1) +
" / " + quiz.length +
" | " + (quiz.length-current-1) +
" left";

document.getElementById("question").innerHTML =
q.q;

let html = "";

q.a.forEach((answer,index)=>{

html += `
<button id="btn${index}"
onclick="checkAnswer(${index})">
${answer}
</button>
`;

});

document.getElementById("answers").innerHTML = html;

document.getElementById("feedback").innerHTML = "";

restoreAnswer();

updateScore();

renderQuestionMap();

}

function checkAnswer(index){

userAnswers[current] = index;

restoreAnswer();

updateScore();

renderQuestionMap();

}

function restoreAnswer(){

let q = quiz[current];

for(let i=0;i<q.a.length;i++){

document.getElementById("btn"+i)
.classList.remove("correct");

document.getElementById("btn"+i)
.classList.remove("wrong");

}

let selected = userAnswers[current];

if(selected === null){
return;
}

if(selected === q.c){

document.getElementById("btn"+selected)
.classList.add("correct");

document.getElementById("feedback").innerHTML =
"✅ Correct!<br><br>" + q.e;

}else{

document.getElementById("btn"+selected)
.classList.add("wrong");

document.getElementById("btn"+q.c)
.classList.add("correct");

document.getElementById("feedback").innerHTML =
"❌ Wrong!<br><br>" + q.e;

}

}

function updateScore(){

let score = 0;

for(let i=0;i<quiz.length;i++){

if(userAnswers[i] === quiz[i].c){
score++;
}

}

document.getElementById("scoreBar").innerHTML =
"Score: " + score +
" / " + quiz.length;

}

function nextQuestion(){

if(current < quiz.length-1){

current++;

loadQuestion();

}else{

finishQuiz();

}

}

function prevQuestion(){

if(current > 0){

current--;

loadQuestion();

}

}

function jumpToQuestion(){

let num =
parseInt(document.getElementById("jumpInput").value);

if(num >= 1 && num <= quiz.length){

current = num - 1;

loadQuestion();

}

}

function renderQuestionMap(){

let html = "";

for(let i=0;i<quiz.length;i++){

let className = "unanswered";

if(userAnswers[i] !== null){

if(userAnswers[i] === quiz[i].c){

className = "correct";

}else{

className = "wrong";

}

}

html += `
<button class="qnum ${className}"
onclick="goTo(${i})">
${i+1}
</button>
`;

}

document.getElementById("questionMap").innerHTML =
html;

}

function goTo(index){

current = index;

loadQuestion();

}

function finishQuiz(){

let score = 0;

for(let i=0;i<quiz.length;i++){

if(userAnswers[i] === quiz[i].c){
score++;
}

}

document.getElementById("question").innerHTML =
"🎉 Quiz Finished!";

document.getElementById("answers").innerHTML = "";

document.getElementById("feedback").innerHTML =
"You scored " + score +
" out of " + quiz.length;

document.getElementById("progress").innerHTML =
"Complete";

document.getElementById("scoreBar").innerHTML =
"Final Score: " + score +
" / " + quiz.length;

document.getElementById("questionMap").innerHTML =
"";

}

loadQuestion();

</script>

</body>

</html>
