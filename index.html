let current = 0;

let userAnswers = Array(quiz.length).fill(null);

function loadQuestion(){

let q = quiz[current];

document.getElementById("progress").innerHTML =
"Question " + (current+1) +
" / " + quiz.length +
" | " + (quiz.length-current-1) +
" left";

document.getElementById("question").innerHTML =
q.q;

let html = "";

q.a.forEach((answer,index)=>{

html += `
<button id="btn${index}"
onclick="checkAnswer(${index})">
${answer}
</button>
`;

});

document.getElementById("answers").innerHTML = html;

document.getElementById("feedback").innerHTML = "";

restoreAnswer();

updateScore();

}

function checkAnswer(index){

userAnswers[current] = index;

restoreAnswer();

updateScore();

}

function restoreAnswer(){

let q = quiz[current];

for(let i=0;i<q.a.length;i++){

document.getElementById("btn"+i)
.classList.remove("correct");

document.getElementById("btn"+i)
.classList.remove("wrong");

}

let selected = userAnswers[current];

if(selected === null){
return;
}

if(selected === q.c){

document.getElementById("btn"+selected)
.classList.add("correct");

document.getElementById("feedback").innerHTML =
"✅ Correct!<br><br>" + q.e;

}else{

document.getElementById("btn"+selected)
.classList.add("wrong");

document.getElementById("btn"+q.c)
.classList.add("correct");

document.getElementById("feedback").innerHTML =
"❌ Wrong!<br><br>" + q.e;

}

}

function updateScore(){

let score = 0;

for(let i=0;i<quiz.length;i++){

if(userAnswers[i] === quiz[i].c){
score++;
}

}

document.getElementById("scoreBar").innerHTML =
"Score: " + score +
" / " + quiz.length;

}

function nextQuestion(){

if(current < quiz.length-1){

current++;

loadQuestion();

}else{

finishQuiz();

}

}

function prevQuestion(){

if(current > 0){

current--;

loadQuestion();

}

}

function finishQuiz(){

let score = 0;

for(let i=0;i<quiz.length;i++){

if(userAnswers[i] === quiz[i].c){
score++;
}

}

document.getElementById("question").innerHTML =
"🎉 Quiz Finished!";

document.getElementById("answers").innerHTML = "";

document.getElementById("feedback").innerHTML =
"You scored " + score +
" out of " + quiz.length;

document.getElementById("progress").innerHTML =
"Complete";

document.getElementById("scoreBar").innerHTML =
"Final Score: " + score +
" / " + quiz.length;

}
